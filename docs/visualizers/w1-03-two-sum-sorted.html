<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .cell-glow-emerald { box-shadow: 0 0 14px rgba(52, 211, 153, 0.45); }
    .cell-glow-amber { box-shadow: 0 0 14px rgba(251, 191, 36, 0.45); }
  </style>
</head>
<body class="bg-transparent text-slate-100 antialiased p-2 font-sans selection:bg-blue-500/30">
  <div class="bg-[#1e293b] text-slate-100 border-2 border-slate-600 rounded-2xl p-4 shadow-2xl max-w-xl mx-auto space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <div>
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>🎯</span> Mô Phỏng: Two Sum II (LeetCode #167)
        </h2>
        <p class="text-xs text-slate-300 mt-0.5">Two Pointers Kẹp Hai Đầu Trên Mảng Đã Sắp Xếp</p>
      </div>
      <span id="step-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/40 shadow-sm">
        Bước 1 / 4
      </span>
    </div>

    <!-- Array Display -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs text-slate-300 font-medium px-1">
        <span>Mảng đã sắp xếp:</span>
        <div class="flex gap-2">
          <span class="font-mono bg-slate-900 px-2 py-0.5 rounded text-sky-300 border border-slate-700">[2, 7, 11, 15]</span>
          <span class="font-mono bg-blue-500/20 px-2 py-0.5 rounded text-blue-300 border border-blue-400/40 font-bold">Target = 9</span>
        </div>
      </div>

      <!-- Elements Grid -->
      <div class="grid grid-cols-4 gap-3 py-1" id="array-container">
        <!-- Rendered by JS -->
      </div>

      <!-- Legend -->
      <div class="flex items-center justify-center gap-6 text-xs font-semibold pt-1 text-slate-200">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block shadow"></span>
          <span>Left (Số nhỏ nhất)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-amber-400 inline-block shadow"></span>
          <span>Right (Số lớn nhất)</span>
        </div>
      </div>
    </div>

    <!-- Math Calculation Box -->
    <div class="bg-[#0f172a] border border-slate-700 rounded-xl p-3 space-y-1.5">
      <div class="flex items-center justify-between text-xs font-mono">
        <span class="text-slate-400 font-semibold">TÍNH TỔNG:</span>
        <span id="calc-formula" class="font-bold text-slate-200 tracking-wider">numbers[left] + numbers[right]</span>
      </div>
      <div id="calc-result" class="text-base font-bold font-mono tracking-wide text-center py-1">
        <!-- Sum text -->
      </div>
    </div>

    <!-- Explanation Box -->
    <div class="bg-slate-800/90 border border-sky-500/40 rounded-xl p-3 min-h-[76px] flex items-start gap-3 shadow-inner">
      <span class="text-2xl select-none" id="action-icon">🎯</span>
      <div class="text-xs space-y-1 leading-relaxed">
        <p id="action-title" class="font-bold text-sky-300 text-sm"></p>
        <p id="action-desc" class="text-slate-200 font-normal"></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between pt-1">
      <button id="btn-prev" onclick="prevStep()" class="px-3.5 py-2 text-xs font-bold rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
        ← Bước Trước
      </button>

      <div class="flex items-center gap-2">
        <button id="btn-reset" onclick="goToStep(0)" class="px-2.5 py-1.5 text-xs text-slate-400 hover:text-white transition-colors">
          Làm lại
        </button>
        <button id="btn-next" onclick="nextStep()" class="px-5 py-2 text-xs font-bold rounded-lg bg-blue-500 hover:bg-blue-400 text-white shadow-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center gap-1.5">
          <span>Bước Tiếp</span>
          <span class="text-sm">→</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    const numbers = [2, 7, 11, 15];
    const target = 9;

    const steps = [
      {
        L: 0, R: 3,
        sum: 17,
        formula: "2 + 15 = 17 > 9 (Đang thừa)",
        title: "Bắt đầu kẹp hai đầu: L = 0 (2), R = 3 (15)",
        desc: "Tổng là 2 + 15 = 17, lớn hơn Target 9! Vì mảng đã sắp xếp, muốn tổng nhỏ lại ta bắt buộc phải kéo con trỏ Right sang trái!",
        icon: "👉"
      },
      {
        L: 0, R: 2,
        sum: 13,
        formula: "2 + 11 = 13 > 9 (Vẫn thừa)",
        title: "Right lùi về chỉ mục 2 (11)",
        desc: "Tổng là 2 + 11 = 13, vẫn lớn hơn 9. Tiếp tục kéo Right sang trái để lấy số nhỏ hơn.",
        icon: "👉"
      },
      {
        L: 0, R: 1,
        sum: 9,
        formula: "2 + 7 = 9 === Target (CHÍNH XÁC! 🎉)",
        title: "TÌM THẤY CẶP PHẦN TỬ THỎA MÃN!",
        desc: "Tổng đúng bằng 9! Vị trí là index 0 và 1. Theo yêu cầu 1-indexed của LeetCode #167, trả về [1, 2]!",
        icon: "🎉"
      },
      {
        L: 0, R: 1,
        sum: 9,
        formula: "KẾT QUẢ: [1, 2] (1-indexed)",
        title: "Hoàn tất thuật toán Two Sum II!",
        desc: "Chỉ sau 3 bước duyệt, ta đã tìm thấy kết quả mà không cần dùng thêm bất kỳ ô nhớ phụ nào. O(n) Time, O(1) Space!",
        icon: "🏆"
      }
    ];

    let currentStep = 0;

    function render() {
      const step = steps[currentStep];

      document.getElementById('step-badge').innerText = `Bước ${currentStep + 1} / ${steps.length}`;
      document.getElementById('calc-formula').innerText = `numbers[${step.L}] + numbers[${step.R}]`;
      
      if (step.sum === target) {
        document.getElementById('calc-result').innerHTML = `<span class="text-emerald-400 font-bold text-lg">${step.formula}</span>`;
      } else {
        document.getElementById('calc-result').innerHTML = `<span class="text-amber-300 font-bold text-base">${step.formula} ➔ Giảm Right</span>`;
      }

      document.getElementById('action-icon').innerText = step.icon;
      document.getElementById('action-title').innerText = step.title;
      document.getElementById('action-desc').innerText = step.desc;

      const container = document.getElementById('array-container');
      container.innerHTML = '';

      numbers.forEach((val, idx) => {
        const isL = step.L === idx;
        const isR = step.R === idx;

        let borderColor = 'border-slate-600';
        let bgStyle = 'bg-slate-800/90';
        let textStyle = 'text-slate-200';
        let glowClass = '';

        if (isL) {
          borderColor = 'border-emerald-400';
          bgStyle = 'bg-emerald-500/30';
          textStyle = 'text-emerald-300 font-black';
          glowClass = 'cell-glow-emerald';
        } else if (isR) {
          borderColor = 'border-amber-400';
          bgStyle = 'bg-amber-500/30';
          textStyle = 'text-amber-300 font-black';
          glowClass = 'cell-glow-amber';
        }

        const cell = document.createElement('div');
        cell.className = `flex flex-col items-center justify-center p-3 rounded-xl border-2 ${borderColor} ${bgStyle} ${glowClass} transition-all duration-200`;
        cell.innerHTML = `
          <span class="text-[10px] text-slate-400 font-mono font-bold">[${idx}] (Vị trí ${idx + 1})</span>
          <span class="text-2xl font-mono my-1 ${textStyle}">${val}</span>
          <span class="text-[10px] font-bold ${isL ? 'text-emerald-400' : isR ? 'text-amber-400' : 'text-transparent select-none'}">${isL ? 'Left' : isR ? 'Right' : '-'}</span>
        `;
        container.appendChild(cell);
      });

      document.getElementById('btn-prev').disabled = currentStep === 0;
      document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
    }

    function nextStep() { if (currentStep < steps.length - 1) { currentStep++; render(); } }
    function prevStep() { if (currentStep > 0) { currentStep--; render(); } }
    function goToStep(idx) { currentStep = idx; render(); }

    render();
  </script>
</body>
</html>
