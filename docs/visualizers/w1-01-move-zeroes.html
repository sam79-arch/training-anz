<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .cell-glow-blue { box-shadow: 0 0 14px rgba(56, 189, 248, 0.45); }
    .cell-glow-emerald { box-shadow: 0 0 14px rgba(52, 211, 153, 0.45); }
  </style>
</head>
<body class="bg-transparent text-slate-100 antialiased p-2 font-sans selection:bg-blue-500/30">
  <div class="bg-[#1e293b] text-slate-100 border-2 border-slate-600 rounded-2xl p-4 shadow-2xl max-w-xl mx-auto space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <div>
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>🎯</span> Mô Phỏng Thuật Toán: Move Zeroes (LeetCode #283)
        </h2>
        <p class="text-xs text-slate-300 mt-0.5">Two Pointers Nhanh - Chậm (Fast & Slow / Write Index)</p>
      </div>
      <span id="step-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/40 shadow-sm">
        Bước 1 / 8
      </span>
    </div>

    <!-- Array Visualizer -->
    <div class="space-y-2">
      <div class="flex justify-between items-center text-xs text-slate-300 font-medium px-1">
        <span>Mảng hiện tại trong bộ nhớ:</span>
        <span class="font-mono bg-slate-900 px-2 py-0.5 rounded text-sky-300 border border-slate-700" id="raw-array">[0, 1, 0, 3, 12]</span>
      </div>

      <!-- Array Elements Grid -->
      <div class="grid grid-cols-5 gap-2.5" id="array-container">
        <!-- Rendered by JS -->
      </div>

      <!-- Pointers Legend -->
      <div class="flex items-center justify-center gap-6 text-xs font-semibold pt-1 text-slate-200">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block shadow"></span>
          <span>writeIdx (Chậm - Vị trí ghi)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-sky-400 inline-block shadow"></span>
          <span>readIdx (Nhanh - Quét mảng)</span>
        </div>
      </div>
    </div>

    <!-- State & Calculation Box -->
    <div class="bg-[#0f172a] border border-slate-700 rounded-xl p-3 space-y-1.5">
      <div class="flex items-center justify-between text-xs font-mono">
        <span class="text-slate-400 font-semibold">TRẠNG THÁI HIỆN TẠI:</span>
        <span id="phase-badge" class="font-bold text-sky-400 tracking-wider">PHA 1: GOM SỐ KHÁC 0</span>
      </div>
      <div id="operation-text" class="text-base font-bold font-mono tracking-wide text-center py-1">
        <!-- Operation -->
      </div>
    </div>

    <!-- Explanation Box -->
    <div class="bg-slate-800/90 border border-sky-500/40 rounded-xl p-3 min-h-[76px] flex items-start gap-3 shadow-inner">
      <span class="text-2xl select-none" id="action-icon">🎯</span>
      <div class="text-xs space-y-1 leading-relaxed">
        <p id="action-title" class="font-bold text-sky-300 text-sm"></p>
        <p id="action-desc" class="text-slate-200 font-normal"></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-between pt-1">
      <button id="btn-prev" onclick="prevStep()" class="px-3.5 py-2 text-xs font-bold rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
        ← Bước Trước
      </button>

      <div class="flex items-center gap-2">
        <button id="btn-reset" onclick="goToStep(0)" class="px-2.5 py-1.5 text-xs text-slate-400 hover:text-white transition-colors">
          Làm lại
        </button>
        <button id="btn-next" onclick="nextStep()" class="px-5 py-2 text-xs font-bold rounded-lg bg-blue-500 hover:bg-blue-400 text-white shadow-lg disabled:opacity-30 disabled:cursor-not-allowed transition-all flex items-center gap-1.5">
          <span>Bước Tiếp</span>
          <span class="text-sm">→</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    const steps = [
      {
        arr: [0, 1, 0, 3, 12],
        read: 0, write: 0,
        phase: "PHA 1: GOM SỐ KHÁC 0",
        op: "nums[readIdx] = 0 (Là số 0 ➔ Bỏ qua)",
        title: "Bắt đầu tại readIdx = 0",
        desc: "Phần tử hiện tại là 0. Vì là số 0 nên writeIdx giữ nguyên tại 0, readIdx tiếp tục tiến lên.",
        icon: "⏭️"
      },
      {
        arr: [1, 1, 0, 3, 12],
        read: 1, write: 1,
        phase: "PHA 1: GOM SỐ KHÁC 0",
        op: "nums[0] = 1 ➔ writeIdx tăng lên 1",
        title: "Gặp số khác 0: giá trị 1",
        desc: "Ghi số 1 vào nums[writeIdx=0]. Tăng writeIdx lên 1.",
        icon: "✍️"
      },
      {
        arr: [1, 1, 0, 3, 12],
        read: 2, write: 1,
        phase: "PHA 1: GOM SỐ KHÁC 0",
        op: "nums[readIdx] = 0 (Là số 0 ➔ Bỏ qua)",
        title: "Gặp số 0 tại chỉ mục 2",
        desc: "Bỏ qua số 0, writeIdx vẫn giữ nguyên tại 1 chờ số khác 0 tiếp theo.",
        icon: "⏭️"
      },
      {
        arr: [1, 3, 0, 3, 12],
        read: 3, write: 2,
        phase: "PHA 1: GOM SỐ KHÁC 0",
        op: "nums[1] = 3 ➔ writeIdx tăng lên 2",
        title: "Gặp số khác 0: giá trị 3",
        desc: "Ghi số 3 vào nums[writeIdx=1]. Tăng writeIdx lên 2.",
        icon: "✍️"
      },
      {
        arr: [1, 3, 12, 3, 12],
        read: 4, write: 3,
        phase: "PHA 1: GOM SỐ KHÁC 0",
        op: "nums[2] = 12 ➔ writeIdx tăng lên 3",
        title: "Gặp số khác 0: giá trị 12",
        desc: "Ghi số 12 vào nums[writeIdx=2]. Tăng writeIdx lên 3. Quét hết mảng ở Pha 1!",
        icon: "✍️"
      },
      {
        arr: [1, 3, 12, 0, 12],
        read: null, write: 3,
        phase: "PHA 2: ĐIỀN SỐ 0 VÀO ĐUÔI",
        op: "nums[3] = 0 (Điền số 0 đầu tiên)",
        title: "Bắt đầu Pha 2: Điền 0 từ writeIdx = 3",
        desc: "Tất cả các số khác 0 đã được dồn lên đầu. Giờ chỉ việc điền 0 vào vị trí chỉ mục 3.",
        icon: "0️⃣"
      },
      {
        arr: [1, 3, 12, 0, 0],
        read: null, write: 4,
        phase: "PHA 2: ĐIỀN SỐ 0 VÀO ĐUÔI",
        op: "nums[4] = 0 (Điền số 0 cuối cùng)",
        title: "Điền số 0 vào chỉ mục 4",
        desc: "Ghi 0 vào vị trí cuối cùng của mảng. Mảng đã hoàn tất!",
        icon: "0️⃣"
      },
      {
        arr: [1, 3, 12, 0, 0],
        read: null, write: null,
        phase: "HOÀN THÀNH 100%",
        op: "KẾT QUẢ: [1, 3, 12, 0, 0]",
        title: "Hoàn tất thuật toán Move Zeroes!",
        desc: "Toàn bộ số 0 đã được đưa về cuối mà vẫn giữ nguyên thứ tự tương đối của các số khác. O(n) Time, O(1) Space!",
        icon: "🏆"
      }
    ];

    let currentStep = 0;

    function render() {
      const step = steps[currentStep];

      document.getElementById('step-badge').innerText = `Bước ${currentStep + 1} / ${steps.length}`;
      document.getElementById('raw-array').innerText = `[${step.arr.join(', ')}]`;
      document.getElementById('phase-badge').innerText = step.phase;
      document.getElementById('operation-text').innerText = step.op;
      document.getElementById('action-icon').innerText = step.icon;
      document.getElementById('action-title').innerText = step.title;
      document.getElementById('action-desc').innerText = step.desc;

      const container = document.getElementById('array-container');
      container.innerHTML = '';

      step.arr.forEach((val, idx) => {
        const isRead = step.read === idx;
        const isWrite = step.write === idx;

        let borderColor = 'border-slate-600';
        let bgStyle = 'bg-slate-800/90';
        let textStyle = 'text-slate-200';
        let glowClass = '';

        if (isRead && isWrite) {
          borderColor = 'border-purple-400';
          bgStyle = 'bg-purple-500/30';
          textStyle = 'text-purple-300 font-black';
        } else if (isWrite) {
          borderColor = 'border-emerald-400';
          bgStyle = 'bg-emerald-500/30';
          textStyle = 'text-emerald-300 font-black';
          glowClass = 'cell-glow-emerald';
        } else if (isRead) {
          borderColor = 'border-sky-400';
          bgStyle = 'bg-sky-500/30';
          textStyle = 'text-sky-300 font-black';
          glowClass = 'cell-glow-blue';
        }

        let pointerLabel = '<span class="text-[10px] text-transparent select-none">-</span>';
        if (isRead && isWrite) pointerLabel = '<span class="text-[10px] text-purple-300 font-bold">R, W</span>';
        else if (isWrite) pointerLabel = '<span class="text-[10px] text-emerald-300 font-bold">Write</span>';
        else if (isRead) pointerLabel = '<span class="text-[10px] text-sky-300 font-bold">Read</span>';

        const cell = document.createElement('div');
        cell.className = `flex flex-col items-center justify-center p-2 rounded-xl border-2 ${borderColor} ${bgStyle} ${glowClass} transition-all duration-200`;
        cell.innerHTML = `
          <span class="text-[10px] text-slate-400 font-mono font-bold">[${idx}]</span>
          <span class="text-xl font-mono my-1 ${textStyle}">${val}</span>
          ${pointerLabel}
        `;
        container.appendChild(cell);
      });

      document.getElementById('btn-prev').disabled = currentStep === 0;
      document.getElementById('btn-next').disabled = currentStep === steps.length - 1;
    }

    function nextStep() { if (currentStep < steps.length - 1) { currentStep++; render(); } }
    function prevStep() { if (currentStep > 0) { currentStep--; render(); } }
    function goToStep(idx) { currentStep = idx; render(); }

    render();
  </script>
</body>
</html>
